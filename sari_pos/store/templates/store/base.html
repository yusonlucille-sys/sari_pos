<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sari-Sari Enterprise POS{% endblock %}</title>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --surface: #ffffff;
            --enterprise-dark: #090d16;
            --steel-border: #cbd5e1;
            --accent-blue: #2563eb;
            --accent-amber: #d97706;
            --danger-red: #dc2626;
            --success-green: #10b981;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            font-size: 14px;
        }

        /* Industrial Corporate Navbar */
        nav {
            background: var(--enterprise-dark);
            color: #fff;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent-amber);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.15);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -0.01em;
        }

        .nav-brand svg {
            width: 24px;
            height: 24px;
            fill: var(--accent-amber);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a.nav-item {
            color: #94a3b8;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        nav a.nav-item svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        nav a.nav-item:hover, nav a.nav-item.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .nav-item.fast-login {
            background: var(--accent-blue);
            color: #fff;
            border-color: transparent;
        }

        .nav-item.fast-login:hover {
            background: #1d4ed8;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--success-green);
            font-weight: 600;
            font-size: 13px;
            padding: 6px 12px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 4px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* Layout Grid */
        .pos-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            padding: 24px;
            max-width: 1500px;
            margin: 0 auto;
        }

        /* Panels & Cards */
        .products-panel, .cart-panel, .checker, .receipt {
            background: var(--surface);
            padding: 20px;
            border-radius: 6px;
            border: 1px solid var(--steel-border);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.04);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 14px;
            margin-top: 16px;
        }

        .card {
            border: 1px solid var(--steel-border);
            border-radius: 4px;
            padding: 14px;
            text-align: left;
            background: var(--surface);
            transition: border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.1);
        }

        .card h3 {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 6px 0;
            color: var(--enterprise-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .price {
            font-weight: 700;
            color: var(--accent-blue);
            font-size: 16px;
            font-variant-numeric: tabular-nums;
            margin-bottom: 2px;
        }

        .stock {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-variant-numeric: tabular-nums;
        }

        /* Buttons */
        .btn {
            background: var(--enterprise-dark);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .btn:hover {
            background: #1e293b;
        }

        .btn.primary { background: var(--accent-blue); }
        .btn.primary:hover { background: #1d4ed8; }

        .btn.ghost { 
            background: transparent; 
            color: var(--enterprise-dark); 
            border: 1px solid var(--steel-border); 
        }
        .btn.ghost:hover { 
            background: #f8fafc; 
            border-color: var(--text-muted);
        }

        .btn.danger { background: var(--danger-red); color: #fff; padding: 4px 8px; }
        .btn.danger:hover { background: #b91c1c; }

        .btn.wide { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        .btn:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }

        /* Search & Inputs */
        .search-bar {
            display: flex;
            gap: 10px;
        }

        .search-bar input {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid var(--steel-border);
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .search-bar input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }

        /* Cart & Tables */
        .cart-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .cart-table td {
            padding: 10px 4px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
        }

        .qty {
            width: 55px;
            padding: 5px;
            text-align: center;
            border: 1px solid var(--steel-border);
            border-radius: 4px;
            font-variant-numeric: tabular-nums;
        }

        .total-row {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            margin: 16px 0;
            padding-top: 12px;
            border-top: 2px dashed var(--steel-border);
            font-variant-numeric: tabular-nums;
        }

        .change-row {
            margin: 10px 0;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
        }

        .muted { color: var(--text-muted); font-size: 13px; }

        table.simple {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            margin-top: 10px;
            font-size: 13px;
        }

        table.simple th {
            background: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.05em;
            border-bottom: 2px solid var(--steel-border);
        }

        table.simple th, table.simple td {
            padding: 12px 10px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
            font-variant-numeric: tabular-nums;
        }

        .checker, .receipt {
            max-width: 600px;
            margin: 40px auto;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'pos' %}" class="nav-brand">
            <!-- Vector Store Icon -->
            <svg viewBox="0 0 24 24"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h6v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/></svg>
            SARI-SARI ENTERPRISE
        </a>
        <div class="nav-links">
            <a href="{% url 'pos' %}" class="nav-item">
                <!-- Terminal Vector -->
                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
                POS
            </a>
            <a href="{% url 'price_checker' %}" class="nav-item">
                <!-- Tag Vector -->
                <svg viewBox="0 0 24 24"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg>
                Checker
            </a>
            <a href="{% url 'sales_list' %}" class="nav-item">
                <!-- Ledger / Chart Vector -->
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                Sales
            </a>
            {% if request.user.is_staff %}
            <a href="{% url 'add_product' %}" class="nav-item" style="color: #f59e0b;">
                <!-- Plus Vector -->
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                Add Item
            </a>
            {% endif %}
            <a href="/admin/" class="nav-item">
                <!-- Settings / Admin Vector -->
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                Admin
            </a>

            {% if request.user.is_authenticated %}
                <div class="status-badge">
                    <svg viewBox="0 0 24 24" style="width:12px; height:12px; fill:currentColor;"><circle cx="12" cy="12" r="8"/></svg>
                    Active
                </div>
            {% else %}
                <a href="{% url 'instant_login' %}" class="nav-item fast-login">
                    <!-- Bolt Vector -->
                    <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l3-8z"/></svg>
                    Fast Login
                </a>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
