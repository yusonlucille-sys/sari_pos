{% extends 'store/base.html' %}
{% block content %}
<h2>Recent Sales</h2>
<table class="simple">
  <tr><th>#</th><th>Date</th><th>Total</th><th>Cash</th><th>Change</th></tr>
  {% for s in sales %}
    <tr>
      <td><a href="{% url 'receipt' s.id %}">{{ s.id }}</a></td>
      <td>{{ s.created_at|date:"M d, Y H:i" }}</td>
      <td>₱{{ s.total }}</td><td>₱{{ s.cash }}</td><td>₱{{ s.change }}</td>
    </tr>
  {% empty %}
    <tr><td colspan="5" class="muted">No sales yet.</td></tr>
  {% endfor %}
</table>
{% endblock %}
