{% extends 'store/base.html' %}
{% block title %}{{ action }} Product{% endblock %}
{% block content %}
<div class="checker" style="max-width: 500px;">
  <h2>{{ action }} Product</h2>
  
  <form method="post" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
    {% csrf_token %}
    
    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: 500;">Product Name</label>
      <input type="text" name="name" value="{{ product.name }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: 500;">Price (₱)</label>
      <input type="number" step="0.01" name="price" value="{{ product.price }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: 500;">Stock Quantity</label>
      <input type="number" name="stock" value="{{ product.stock|default:0 }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: 500;">Unit (e.g. pcs, bottle, pack)</label>
      <input type="text" name="unit" value="{{ product.unit|default:'pcs' }}" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button type="submit" class="btn primary" style="flex: 1; padding: 10px;">Save Product</button>
      <a href="{% url 'pos' %}" class="btn ghost" style="flex: 1; text-align: center; padding: 10px; text-decoration: none;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
